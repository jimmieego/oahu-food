<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Oahu food shortlist</title>
        <meta name="description" content="Restaurant shortlist and map for a trip to Oahu." />
        <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0d1618" media="(prefers-color-scheme: dark)" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Oahu food" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

        <link
            rel="preload"
            href="vendor/fonts/atkinson-hyperlegible-next-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
        <link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css" />
        <link rel="stylesheet" href="styles.css" />

        <script defer src="vendor/leaflet/leaflet.js"></script>
        <script defer src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
        <script defer src="vendor/protomaps-leaflet/protomaps-leaflet.js"></script>
        <script type="module" src="app.js"></script>
    </head>
    <body>
        <header class="masthead">
            <h1 class="masthead-title" id="title">Oahu food shortlist</h1>
            <p class="masthead-meta" id="meta" hidden>
                <span id="count"></span>
                <span class="offline-status" id="offline-status" role="status"></span>
            </p>
            <details class="about" id="about" hidden>
                <summary>About this list</summary>
                <div class="about-body" id="about-body"></div>
            </details>
        </header>

        <div class="map-frame" id="map-frame">
            <div class="map" id="map" role="region" aria-label="Map of the restaurants"></div>
            <div class="map-tools">
                <button class="map-button" type="button" id="show-all">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9V5h4M16 4h4v4M20 15v4h-4M8 20H4v-4" />
                    </svg>
                    Show all
                </button>
                <button class="map-button" type="button" id="locate">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.5 4.5 4 10.8l6.6 2.6 2.6 6.6z" />
                    </svg>
                    My location
                </button>
            </div>
            <button class="map-button map-button--size" type="button" id="map-size" aria-pressed="false">
                <svg class="icon icon--size" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9.5 6 6 6-6" /></svg>
                <span id="map-size-label">Larger map</span>
            </button>
            <p class="map-status" id="map-status" role="status"></p>
        </div>

        <form class="search" id="search" role="search" hidden>
            <div class="search-field">
                <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.5" cy="10.5" r="6.25" />
                    <path d="m15.25 15.25 4.5 4.5" />
                </svg>
                <label class="visually-hidden" for="search-input">Search the restaurants</label>
                <input
                    class="search-input"
                    id="search-input"
                    type="search"
                    placeholder="Search food, names, or areas"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="none"
                    spellcheck="false"
                    enterkeyhint="search"
                />
                <span class="search-count" id="search-count" aria-hidden="true"></span>
                <button class="search-clear" type="button" id="search-clear" hidden>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
                    <span class="visually-hidden">Clear the search</span>
                </button>
            </div>
            <p class="visually-hidden" id="search-status" role="status"></p>
        </form>

        <main class="places" id="places">
            <p class="status-message">Loading restaurants…</p>
        </main>
    </body>
</html>
