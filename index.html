<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Oahu food shortlist</title>
        <meta name="description" content="Restaurant shortlist and map for a trip to Oahu." />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0c1d20" media="(prefers-color-scheme: dark)" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Oahu food" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

        <link
            rel="preload"
            href="vendor/fonts/atkinson-hyperlegible-next-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
        <link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css" />
        <link rel="stylesheet" href="styles.css" />

        <script defer src="vendor/leaflet/leaflet.js"></script>
        <script defer src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
        <script defer src="vendor/protomaps-leaflet/protomaps-leaflet.js"></script>
        <script type="module" src="app.js"></script>
    </head>
    <body>
        <header class="masthead">
            <h1 class="masthead-title" id="title">Oahu food shortlist</h1>
            <details class="about" id="about" hidden>
                <summary>About this list</summary>
                <div class="about-body" id="about-body"></div>
            </details>
        </header>

        <div class="map-frame" id="map-frame">
            <div class="map" id="map" role="region" aria-label="Map of the restaurants"></div>
            <div class="map-tools">
                <button class="map-button" type="button" id="show-all">Show all</button>
                <button class="map-button" type="button" id="locate">My location</button>
            </div>
            <button class="map-button map-button--size" type="button" id="map-size" aria-pressed="false">
                Larger map
            </button>
            <p class="map-status" id="map-status" role="status"></p>
        </div>

        <main class="places" id="places">
            <p class="status-message">Loading restaurants…</p>
        </main>
    </body>
</html>
